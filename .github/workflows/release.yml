name: Release

# Publishes to npm when a v* tag is pushed, e.g.
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC). Harmless if you use a token
      # instead, so it is left on to keep that migration a one-line change.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # This is what writes the .npmrc that reads NODE_AUTH_TOKEN. Without
          # it, the env var below is ignored and the publish fails as anonymous.
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify before publishing
        run: npm run verify

      - name: Resolve the version to publish
        id: version
        run: |
          PKG=$(node -p "require('./package.json').version")

          # workflow_dispatch runs from a branch, so GITHUB_REF_NAME is "main"
          # rather than a tag. Only compare when we were actually triggered by a
          # tag; a manual run publishes whatever package.json says.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match package.json $PKG"
              exit 1
            fi
            echo "triggered by tag v$TAG"
          else
            echo "manual run from $GITHUB_REF_NAME"
          fi

          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "publishing $PKG"

      - name: Stop if this version is already on npm
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER="${{ steps.version.outputs.version }}"
          # A published version can never be reused, so failing here with a clear
          # message beats letting npm reject it with E403 halfway through.
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::error::$PKG@$VER is already published — bump the version first"
            exit 1
          fi
          echo "$PKG@$VER is unpublished, continuing"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # The secret is named NPM_TOKEN; the variable npm reads is
          # NODE_AUTH_TOKEN. They are different names on purpose and both are
          # required — setting only NPM_TOKEN publishes as an anonymous user.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
