buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  // Only pull the plugins in when this project is built on its own. As a
  // dependency of an app, the app's root buildscript already supplies AGP and
  // the Kotlin plugin and subprojects inherit that classpath — declaring a
  // second, pinned version here is how libraries end up fighting the host app's
  // toolchain.
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
    }
    dependencies {
      classpath "com.android.tools.build:gradle:8.7.2"
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '2.0.21')}"
    }
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

android {
  namespace "com.figmablur"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    // 31 is where RenderEffect and RenderNode-based hardware blur land. Below it
    // there is no GPU backdrop blur on Android at all, only CPU bitmap blurring —
    // which is exactly the jank this library exists to avoid, so we degrade to a
    // flat tint instead. See README "Why minSdk 31".
    minSdk safeExtGet("minSdkVersion", 24)
    targetSdk safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      java.srcDirs = ["src/main/java"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '2.0.21')}"
  // For @RequiresApi on HardwareBackdrop, which is the marker that keeps the
  // API 31+ surface out of the classes loaded on older devices.
  implementation "androidx.annotation:annotation:1.9.1"
}

react {
  jsRootDir = file("../src/")
  libraryName = "RNFigmaBlurSpec"
  codegenJavaPackageName = "com.figmablur"
}
